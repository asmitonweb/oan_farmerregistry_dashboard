version: "3.8"

services:
  farmer-registry-dashboard-ui:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_PORTAL_URL: ${NEXT_PUBLIC_PORTAL_URL:-http://localhost:3001}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8001/api/v1/farmer-registry}
    image: farmer-registry-dashboard:latest
    container_name: farmer-registry-dashboard-ui
    ports:
      - "${PORT:-3002}:3000"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
